version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: specodezhda_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: specodezhda
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # автоматически выполнит init.sql при первом старте

volumes:
  pgdata: